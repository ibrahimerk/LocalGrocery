<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huntsville Grocery Price Comparison</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hero-banner { background: linear-gradient(135deg, #4ade80 0%, #3b82f6 100%); height: 300px; }
    .product-card { transition: transform 0.3s, box-shadow 0.3s; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .walmart-badge { background-color: #0071ce; }
    .kroger-badge  { background-color: #e2001a; }
    .cheapest-tag { background-color: #10b981; }
  </style>
</head>
<body class="bg-gray-50">

  <div class="hero-banner flex items-center justify-center text-white">
    <div class="text-center px-4">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Huntsville Grocery Price Finder</h1>
      <p class="text-xl mb-8">Compare prices between Walmart and Kroger instantly</p>
      <div class="relative max-w-2xl mx-auto">
        <input id="searchInput" type="text" placeholder="Search for milk, eggs, bread..." 
               class="w-full py-4 px-6 rounded-full shadow-lg focus:outline-none text-gray-800">
        <button onclick="searchProducts()"
                class="absolute right-2 top-2 bg-green-500 text-white p-2 rounded-full hover:bg-green-600 transition">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="container mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-md p-6 mb-8 grid grid-cols-1 md:grid-cols-4 gap-6">
      <div>
        <label class="block text-gray-700 mb-2">Category</label>
        <select id="categoryFilter" class="w-full p-3 border rounded-lg">
          <option value="">All Categories</option>
          <option value="dairy">Dairy</option>
          <option value="bakery">Bakery</option>
          <option value="meat">Meat</option>
          <option value="produce">Produce</option>
          <option value="frozen fruits">Frozen Fruits</option>
          <option value="frozen meals">Frozen Meals</option>
          <option value="frozen vegetables">Frozen Vegetables</option>
          <option value="snacks">Snacks</option>
        </select>
      </div>
      <div>
        <label class="block text-gray-700 mb-2">Store</label>
        <select id="storeFilter" class="w-full p-3 border rounded-lg">
          <option value="">All Stores</option>
          <option value="walmart">Walmart</option>
          <option value="kroger">Kroger</option>
        </select>
      </div>
      <div>
        <label class="block text-gray-700 mb-2">Sort By</label>
        <select id="sortFilter" class="w-full p-3 border rounded-lg">
          <option value="">Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>
      <div class="flex items-end md:justify-end">
        <button onclick="searchProducts()"
                class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition">
          Apply Filters
        </button>
      </div>
    </div>


    <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>

</body>
</html>
